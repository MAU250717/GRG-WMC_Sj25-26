<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRG-WMC</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
</head>
<body>
<main class="container" id="content"></main>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
marked.use({ gfm: true, breaks: true });

let currentFile = 'README.md';

function loadFile(file, anchor) {
  if (file === currentFile && !anchor) return;
  currentFile = file;

  fetch(file)
    .then(r => { if (!r.ok) throw new Error(); return r.text(); })
    .then(md => {
      document.getElementById('content').innerHTML = marked.parse(md);
      if (anchor) {
        setTimeout(() => document.getElementById(anchor)?.scrollIntoView({ behavior: 'smooth' }), 50);
      }
    })
    .catch(() => {
      document.getElementById('content').innerHTML = '<p>Konnte nicht geladen werden.</p>';
    });
}

document.getElementById('content').addEventListener('click', e => {
  const link = e.target.closest('a');
  if (!link) return;

  const href = link.getAttribute('href');
  if (!href) return;
  if (href.startsWith('http://') || href.startsWith('https://') || href.startsWith('mailto:')) return;

  if (href.startsWith('#')) {
    e.preventDefault();
    document.getElementById(href.slice(1))?.scrollIntoView({ behavior: 'smooth' });
    return;
  }

  const [filePart, anchorPart] = href.split('#');
  if (!filePart.endsWith('.md')) return;

  e.preventDefault();

  const baseDir = currentFile.includes('/') ? currentFile.split('/').slice(0, -1).join('/') + '/' : '';
  const raw = baseDir + filePart;
  const parts = raw.split('/');
  const norm = [];
  for (const p of parts) {
    if (p === '' || p === '.') continue;
    if (p === '..') { norm.pop(); continue; }
    norm.push(p);
  }
  const resolved = norm.join('/');

  if (resolved === currentFile) {
    if (anchorPart) document.getElementById(anchorPart)?.scrollIntoView({ behavior: 'smooth' });
    return;
  }

  location.hash = resolved;
  loadFile(resolved, anchorPart);
});

window.addEventListener('hashchange', () => {
  const file = location.hash.slice(1) || 'README.md';
  if (file !== currentFile) loadFile(file);
});

currentFile = location.hash.slice(1) || 'README.md';
loadFile(currentFile);
</script>
</body>
</html>
