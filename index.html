<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRG-WMC – Web & Mobile Computing</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌐</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --pico-font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  html {
    scroll-behavior: smooth;
    scroll-padding-top: 5rem;
  }

  body > header {
    background: linear-gradient(135deg, #016b7a, #0e9594);
    color: #fff;
    margin: 0;
    padding: .75rem 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,.12);
  }

  body > header .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  body > header h1 {
    margin: 0;
    font-size: 1.2rem;
    color: #fff;
    line-height: 1.2;
  }

  .hero-sub {
    font-size: .8rem;
    opacity: .8;
    margin: 0;
    line-height: 1.2;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: .5rem;
  }

  .gh-link {
    display: inline-flex;
    align-items: center;
    color: #fff;
    opacity: .7;
    transition: opacity .2s;
    text-decoration: none;
    font-size: 1rem;
  }

  .gh-link:hover { opacity: 1; }

  .theme-toggle {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 50%;
    width: 2.2rem;
    height: 2.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    padding: 0;
    color: #fff;
    transition: background .2s;
  }

  .theme-toggle:hover { background: rgba(255,255,255,.25); }

  .page-grid {
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 2rem;
    align-items: start;
  }

  @media (max-width:768px) {
    .page-grid { grid-template-columns: 1fr; }
  }

  #toc {
    position: sticky;
    top: 5rem;
    font-size: .85rem;
  }

  @media (max-width:768px) {
    #toc {
      position: static;
      border-top: 1px solid var(--pico-muted-border-color, #ddd);
      padding-top: 1rem;
      margin-bottom: 1.5rem;
    }
  }

  #toc summary {
    font-weight: 600;
    cursor: pointer;
    color: var(--pico-primary);
    padding: .3rem 0;
  }

  #toc-list {
    list-style: none;
    padding: 0;
    margin: .5rem 0 0 0;
  }

  #toc-list li { margin-bottom: .1rem; }

  #toc-list a {
    text-decoration: none;
    color: var(--pico-contrast);
    border-radius: var(--pico-border-radius, 4px);
    padding: .2rem .4rem;
    display: block;
    border-left: 2px solid transparent;
    transition: all .2s;
  }

  #toc-list a:hover,
  #toc-list a.active {
    background: var(--pico-primary);
    color: #fff;
    border-left-color: var(--pico-primary-hover);
    padding-left: .6rem;
  }

  #toc-list .toc-h3 { padding-left: 1.2rem; font-size: .82rem; }

  #content { min-height: 50vh; }
  #content h1:first-child { margin-top: 0; }

  #content h1:first-child::after {
    content: '';
    display: block;
    width: 3rem;
    height: 3px;
    background: linear-gradient(90deg, var(--pico-primary), var(--pico-primary-hover));
    margin: .8rem 0 1.5rem 0;
    border-radius: 2px;
  }

  .loading {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 5rem 0;
  }

  .spinner {
    width: 2rem;
    height: 2rem;
    border: 3px solid var(--pico-muted-border-color, #ddd);
    border-top-color: var(--pico-primary);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-state { text-align: center; padding: 3rem 1rem; }
</style>
</head>
<body>
<header>
  <div class="container">
    <div>
      <h1>GRG-WMC</h1>
      <p class="hero-sub">Web &amp; Mobile Computing · 2025/26</p>
    </div>
    <div class="header-actions">
      <a href="https://github.com/georgernstgraf/GRG-WMC" class="gh-link" target="_blank" rel="noopener" title="Repository auf GitHub">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <button class="theme-toggle" id="themeToggle" aria-label="Theme umschalten">&#x2600;</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="page-grid">
    <article id="content">
      <div class="loading"><div class="spinner"></div></div>
    </article>
    <aside id="toc">
      <details open>
        <summary>Inhalt</summary>
        <ul id="toc-list"></ul>
      </details>
    </aside>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
</script>
<script>
  const STORAGE_KEY = 'grg-wmc-theme';
  const content = document.getElementById('content');
  const tocList = document.getElementById('toc-list');
  const themeToggle = document.getElementById('themeToggle');

  function getPreferredTheme() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  }

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem(STORAGE_KEY, theme);
    themeToggle.innerHTML = theme === 'dark' ? '&#x2600;' : '&#x263E;';
  }

  setTheme(getPreferredTheme());

  themeToggle.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    setTheme(cur === 'dark' ? 'light' : 'dark');
  });

  marked.use({ gfm: true, breaks: true });

  function slugify(text) {
    return text.toLowerCase().replace(/[^\w]+/g, '-').replace(/^-+|-+$/g, '');
  }

  async function loadReadme() {
    try {
      const res = await fetch('README.md');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const md = await res.text();

      const tokens = marked.lexer(md);

      const tocItems = [];
      tokens.forEach(t => {
        if (t.type === 'heading' && (t.depth === 2 || t.depth === 3)) {
          tocItems.push({ level: t.depth, text: t.text, id: slugify(t.text) });
        }
      });

      const html = marked.parser(tokens);
      content.innerHTML = html;
      renderToc(tocItems);
      setupScrollSpy();
    } catch (err) {
      content.innerHTML = `
        <div class="error-state">
          <hgroup>
            <h2>Inhalt nicht ladbar</h2>
            <p>Die README.md konnte nicht abgerufen werden.</p>
          </hgroup>
          <p style="color:var(--pico-muted-color);font-size:.85rem">${err.message}</p>
          <a href="README.md" role="button" class="outline">Direkt ansehen</a>
        </div>`;
      tocList.innerHTML = '<li style="color:var(--pico-muted-color)">Keine Navigation</li>';
    }
  }

  function renderToc(items) {
    if (!items.length) {
      tocList.innerHTML = '<li style="color:var(--pico-muted-color)">Keine Abschnitte</li>';
      return;
    }
    tocList.innerHTML = items.map(item => {
      const cls = item.level === 3 ? 'toc-h3' : 'toc-h2';
      return `<li><a href="#${item.id}" class="${cls}">${item.text}</a></li>`;
    }).join('');
  }

  function setupScrollSpy() {
    const links = tocList.querySelectorAll('a');
    const headings = document.querySelectorAll('#content h2[id], #content h3[id]');
    if (!headings.length) return;

    function updateActive() {
      let activeId = '';
      for (const h of headings) {
        if (h.getBoundingClientRect().top <= 100) activeId = h.id;
        else break;
      }
      links.forEach(l => {
        l.classList.toggle('active', l.getAttribute('href') === `#${activeId}`);
      });
    }

    let ticking = false;
    window.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(() => { updateActive(); ticking = false; });
        ticking = true;
      }
    }, { passive: true });
    updateActive();
  }

  loadReadme();
</script>
</body>
</html>
